[package]
name = "tsuzuki-relay"
version = "0.1.0"
edition = "2021"
description = "Zero-knowledge blob relay for Tsuzuki: stores encrypted per-device snapshots it cannot read."
license = "AGPL-3.0-or-later"
repository = "https://github.com/CMApex/Tsuzuki"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "net", "signal", "sync"] }
tower-http = { version = "0.6", features = ["cors", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
